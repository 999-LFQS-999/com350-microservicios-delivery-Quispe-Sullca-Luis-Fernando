worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile           on;
    keepalive_timeout  65;

    # Formato de log que muestra a que upstream se envio cada peticion
    log_format gateway '$remote_addr [$time_local] "$request" '
                       '$status -> $upstream_addr ${upstream_response_time}s';
    access_log /var/log/nginx/access.log gateway;

    # C.2 Mejora 1: Rate limiting para login (5 peticiones por minuto)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    # =====================
    # UPSTREAMS (nombres de servicio del docker-compose)
    # =====================
    upstream users_service {
        server users:3001;
    }

    upstream restaurants_service {
        server restaurants:3002;
    }

    upstream orders_service {
        server orders:8000;
    }

    upstream deliveries_service {
        server deliveries:3004;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Laravel responde JSON cuando el cliente lo pide
        proxy_set_header Accept application/json;

        # Pagina de estado del gateway
        location = / {
            return 200 '{"gateway":"nginx","services":["users","restaurants","orders","deliveries"]}';
        }

        # =====================
        # USERS (Node + MongoDB)
        # =====================
        location /api/v1/users {
            proxy_pass http://users_service;
        }

        location /api/v1/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://users_service;
        }

        # =====================
        # RESTAURANTS (Node + MySQL)
        # =====================
        location /api/v1/restaurants {
            proxy_pass http://restaurants_service;
        }

        location /api/v1/dishes {
            proxy_pass http://restaurants_service;
        }

        # =====================
        # ORDERS (Laravel + PostgreSQL)
        # =====================
        location /api/v1/orders {
            proxy_pass http://orders_service;
        }

        # C.2 Mejora 2: Versionado /api/v2/orders agregando X-Api-Version: 2
        location /api/v2/orders {
            proxy_set_header X-Api-Version 2;
            proxy_pass http://orders_service/api/v1/orders;
        }

        # =====================
        # DELIVERIES (Node + PostgreSQL)
        # =====================
        location /api/v1/deliveries {
            proxy_pass http://deliveries_service;
        }
    }
}

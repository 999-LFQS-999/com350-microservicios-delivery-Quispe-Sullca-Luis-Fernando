services:
  # =====================
  # BASES DE DATOS
  # =====================
  mysql:
    image: mysql:8.4
    container_name: mysql_restaurantes
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/La_Paz
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Los .sql de esta carpeta se ejecutan solo la primera vez (volumen vacio)
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  mongodb:
    image: mongo:7
    container_name: mongodb_usuarios
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
      # Los .js de esta carpeta se ejecutan solo la primera vez (crea el usuario admin)
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  postgres:
    image: postgres:16
    container_name: postgres_pedidos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Base creada automaticamente al iniciar; bd_entregas la crea el script init
      POSTGRES_DB: ${POSTGRES_DB_ORDERS}
      TZ: America/La_Paz
      PGTZ: America/La_Paz
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Los .sql / .sh de esta carpeta se ejecutan solo la primera vez (volumen vacio)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_ORDERS}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  # =====================
  # MICROSERVICIOS
  # (orders y deliveries estan comentados: se construyen en las PARTES B y C)
  # =====================
  users:
    build: ./serviceUsers
    image: delivery-users:1.0
    container_name: service_users
    restart: unless-stopped
    env_file:
      - ./serviceUsers/.env
    # Sobrescribe lo del .env para que apunte al contenedor de MongoDB
    environment:
      NODE_ENV: production
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DATABASE}
      MONGO_USER: ${MONGO_ROOT_USER}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - appnet

  restaurants:
    build: ./serviceRestaurants
    image: delivery-restaurants:1.0
    container_name: service_restaurants
    restart: unless-stopped
    env_file:
      - ./serviceRestaurants/.env
    # Sobrescribe lo del .env para que apunte al contenedor de MySQL
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - appnet

  orders:
    build: ./serviceOrders
    image: delivery-orders:1.0
    container_name: service_orders
    restart: unless-stopped
    env_file:
      - ./serviceOrders/.env
    # Sobrescribe lo del .env para que apunte al contenedor de PostgreSQL
    # y al microservicio de restaurantes (comunicacion entre servicios)
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB_ORDERS}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RESTAURANTS_URL: http://restaurants:3002/api/v1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      restaurants:
        condition: service_started
    networks:
      - appnet


  deliveries:
    build: ./serviceDeliveries
    image: delivery-deliveries:1.0
    container_name: service_deliveries
    restart: unless-stopped
    env_file:
      - ./serviceDeliveries/.env
    # Sobrescribe lo del .env para que apunte al contenedor de PostgreSQL
    # y al microservicio de pedidos (comunicacion entre servicios)
    environment:
      NODE_ENV: production
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: ${POSTGRES_DB_DELIVERIES}
      JWT_SECRET: ${JWT_SECRET}
      ORDERS_URL: http://orders:8000/api/v1
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      orders:
        condition: service_started
    networks:
      - appnet


  # =====================
  # API GATEWAY (PROXY INVERSO)
  # =====================
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_gateway
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - users
      - restaurants
      - orders        # PARTE B
      - deliveries    # PARTE C
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  postgres_data:
